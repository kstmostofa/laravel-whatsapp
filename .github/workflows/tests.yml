# Run phpunit on pushes to main and on every PR.
# Tests must pass before publishing a new release tag.

name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - 'resources/**'
      - 'routes/**'
      - 'composer.json'
      - 'phpunit.xml'
      - '.github/workflows/tests.yml'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        # '' = whatever Composer resolves. A non-empty value pins Guzzle.
        guzzle: ['']
        exclude:
          # Laravel 13 pulls in Symfony 8 which requires PHP 8.4+.
          - laravel: '13.*'
            php: '8.2'
          - laravel: '13.*'
            php: '8.3'
        include:
          # Laravel 13 resolves Guzzle 8 by default; keep Guzzle 7 covered too.
          # (Laravel 12 only allows Guzzle 7.) The distinct `guzzle` value
          # makes this an extra job rather than a change to the default one.
          - php: '8.4'
            laravel: '13.*'
            guzzle: '7.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.guzzle && format(' / Guzzle {0}', matrix.guzzle) || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, json, sqlite, pdo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-update --no-interaction
          if [ -n "${{ matrix.guzzle }}" ]; then composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-update --no-interaction; fi
          composer update --prefer-dist --no-interaction --no-progress

      - name: Show resolved versions
        run: |
          composer show laravel/framework | grep -E '^(name|versions)'
          composer show guzzlehttp/guzzle | grep -E '^(name|versions)'

      - name: Run tests
        run: vendor/bin/phpunit --testdox
